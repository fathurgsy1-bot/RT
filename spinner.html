<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinner Doorprize HUT RI ke-81</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --merah:#C81E2C;
    --merah-tua:#7A0E17;
    --putih:#FFFDF6;
    --emas:#D4A017;
    --emas-terang:#F4C948;
    --tinta:#1B1512;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--putih);
    background:
      radial-gradient(ellipse at 50% -10%, #9c1622 0%, transparent 60%),
      linear-gradient(180deg, var(--tinta) 0%, #2a1810 45%, var(--tinta) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
  }

  /* ===== Bunting / umbul-umbul di atas ===== */
  .bunting{
    width:100%;
    max-width:900px;
    display:flex;
    justify-content:space-between;
    padding:0 6vw;
    margin-top:0;
    position:relative;
    z-index:3;
  }
  .bunting .flag{
    width:26px;
    height:38px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    margin-top:-2px;
    animation:sway 3.2s ease-in-out infinite;
    transform-origin:top center;
  }
  .bunting .flag:nth-child(odd){background:var(--merah);}
  .bunting .flag:nth-child(even){background:var(--putih);animation-delay:.4s;}
  .bunting .flag:nth-child(3n){animation-delay:.8s;}
  @keyframes sway{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }
  .string{
    width:100%;
    max-width:900px;
    height:2px;
    background:rgba(244,201,72,.5);
  }

  /* ===== Header ===== */
  header{
    text-align:center;
    margin:26px 20px 4px;
    position:relative;
    z-index:3;
  }
  .eyebrow{
    font-size:.72rem;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--emas-terang);
    font-weight:700;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(2.4rem, 8vw, 4.2rem);
    letter-spacing:1px;
    margin:2px 0 0;
    line-height:.95;
    color:var(--putih);
    text-shadow: 0 3px 0 var(--merah-tua), 0 6px 18px rgba(0,0,0,.5);
  }
  h1 .num{
    color:var(--emas-terang);
    -webkit-text-stroke:1.5px var(--merah-tua);
  }
  .tagline{
    margin-top:8px;
    font-size:1rem;
    font-weight:600;
    color:rgba(255,253,246,.75);
    letter-spacing:.5px;
  }

  /* ===== Sunburst signature behind wheel ===== */
  .stage{
    position:relative;
    width:min(92vw, 460px);
    aspect-ratio:1/1;
    margin:34px auto 6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sunburst{
    position:absolute;
    inset:-14%;
    border-radius:50%;
    background:repeating-conic-gradient(
      var(--emas) 0deg 4deg,
      transparent 4deg 12deg
    );
    opacity:.35;
    animation:spin-slow 90s linear infinite;
    filter:drop-shadow(0 0 30px rgba(212,160,23,.25));
  }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }

  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:17px solid transparent;
    border-right:17px solid transparent;
    border-top:30px solid var(--emas-terang);
    z-index:6;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .pointer::after{
    content:'';
    position:absolute;
    top:-30px; left:-6px;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--emas-terang);
    box-shadow:0 0 0 3px var(--merah-tua);
  }

  #wheelCanvas{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    display:block;
    background:var(--putih);
    border:7px solid var(--emas-terang);
    box-shadow:
      0 0 0 5px var(--merah-tua),
      0 0 0 9px var(--emas),
      0 20px 45px rgba(0,0,0,.55);
    transition: transform 5.4s cubic-bezier(0.15, 0.65, 0.1, 1);
    z-index:2;
  }
  .hub{
    position:absolute;
    width:19%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--emas-terang), var(--emas) 55%, #9c7a12 100%);
    border:3px solid var(--merah-tua);
    z-index:5;
    display:flex;align-items:center;justify-content:center;
    font-size:1.4rem;
    box-shadow:0 4px 12px rgba(0,0,0,.45);
  }

  /* ===== Status / loading ===== */
  #loading{
    margin:30px auto;
    max-width:380px;
    font-size:.92rem;
    background:rgba(255,253,246,.08);
    border:1px solid rgba(244,201,72,.35);
    padding:16px 20px;
    border-radius:14px;
    line-height:1.5;
  }
  #loading small{opacity:.65;display:block;margin-top:6px;}

  /* ===== Spin button ===== */
  #spinBtn{
    background:linear-gradient(180deg, var(--emas-terang), var(--emas));
    color:var(--merah-tua);
    border:none;
    padding:15px 46px;
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:1.25rem;
    letter-spacing:1.5px;
    border-radius:50px;
    cursor:pointer;
    margin:30px 0 8px;
    box-shadow:0 6px 0 #8a6a10, 0 12px 24px rgba(0,0,0,.45);
    transition:transform .08s;
    z-index:3;
  }
  #spinBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #8a6a10; }
  #spinBtn:disabled{ opacity:.55; cursor:not-allowed; }

  .count{
    font-size:.8rem;
    color:rgba(255,253,246,.6);
    margin-bottom:20px;
  }

  footer{
    margin:36px 0 26px;
    text-align:center;
    font-size:.75rem;
    color:rgba(255,253,246,.4);
    z-index:3;
  }

  /* ===== Winner modal ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,5,3,.8);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    position:relative;
    background:linear-gradient(180deg,var(--putih),#fff3d6);
    color:var(--merah-tua);
    border-radius:22px;
    padding:38px 28px 30px;
    text-align:center;
    max-width:360px;width:100%;
    border:4px solid var(--emas-terang);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{
    0%{transform:scale(.55);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }
  .modal .ribbon{
    font-family:'Anton',sans-serif;
    font-size:.85rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--merah);
  }
  .modal .name{
    font-family:'Anton', sans-serif;
    font-size:2.1rem;
    line-height:1.1;
    margin:12px 0 20px;
    word-break:break-word;
    color:var(--tinta);
  }
  .modal button{
    background:var(--merah);
    color:var(--putih);
    border:none;
    padding:11px 30px;
    border-radius:30px;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
  }
  .modal button:hover{background:var(--merah-tua);}

  .confetti{
    position:fixed; top:-12px;
    width:8px;height:14px;
    z-index:60; pointer-events:none;
  }
</style>
</head>
<body>

  <div class="bunting" id="bunting"></div>
  <div class="string"></div>

  <header>
    <div class="eyebrow">Dirgahayu Republik Indonesia</div>
    <h1>DOORPRIZE <span class="num">81</span></h1>
    <div class="tagline">Maju Terus, Nusantara Baru!</div>
  </header>

  <div id="loading">⏳ Memuat data peserta dari Google Spreadsheet…
    <small>Pastikan akses sheet disetel ke "Siapa saja yang memiliki link"</small>
  </div>

  <div class="stage" id="stage" style="display:none;">
    <div class="sunburst"></div>
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="hub">🎁</div>
  </div>

  <button id="spinBtn" style="display:none;">PUTAR SPINNER</button>
  <div class="count" id="countInfo"></div>

  <footer>Dibuat untuk merayakan Kemerdekaan RI ke-81 · 17 Agustus 2026</footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="ribbon">🎉 Selamat Kepada 🎉</div>
      <div class="name" id="winnerName">-</div>
      <button id="closeModal">Lanjutkan</button>
    </div>
  </div>

<script>
// ===== Bunting flags =====
const buntingEl = document.getElementById('bunting');
for(let i=0;i<14;i++){
  const f = document.createElement('div');
  f.className = 'flag';
  buntingEl.appendChild(f);
}

// ===== Ambil data dari Google Sheets (tab "data upload") =====
const sheetId = '1sISk8huyAbvHsgf6nYXUkk6H4u0aevR1J2V__1GGhQY';
const sheetName = encodeURIComponent('data upload');
const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

let participants = [];
const wheelColors = ['#C81E2C', '#FFFDF6', '#D4A017'];

Papa.parse(csvUrl, {
  download: true,
  header: true,
  complete: function(results){
    const data = results.data;
    if(data.length > 0){
      const columnNames = Object.keys(data[0]);
      const targetColumn = columnNames.find(col => col.toLowerCase().includes('nama'));
      if(targetColumn){
        participants = data
          .map(row => row[targetColumn])
          .filter(name => name && name.trim() !== '');
        if(participants.length > 0){
          document.getElementById('loading').style.display = 'none';
          document.getElementById('stage').style.display = 'flex';
          document.getElementById('spinBtn').style.display = 'inline-block';
          updateCount();
          drawWheel();
        } else {
          document.getElementById('loading').innerHTML = '❌ Data pada kolom "Nama" kosong.';
        }
      } else {
        document.getElementById('loading').innerHTML = `❌ Tidak ditemukan kolom dengan judul "Nama". Kolom yang tersedia: ${columnNames.join(', ')}`;
      }
    } else {
      document.getElementById('loading').innerHTML = '❌ Data kosong atau Spreadsheet belum disetel ke "Siapa saja yang memiliki link".';
    }
  },
  error: function(){
    document.getElementById('loading').innerHTML = '❌ Gagal memuat data. Pastikan spreadsheet diatur ke "Anyone with the link can view".';
  }
});

function updateCount(){
  document.getElementById('countInfo').textContent = participants.length + ' peserta di roda';
}

// ===== Wheel drawing =====
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
let startAngle = 0;
let arc = 0;
let spinTimeout = null;
let spinAngleStart = 0;
let spinTime = 0;
let spinTimeTotal = 0;

function drawWheel(){
  if(participants.length === 0) return;
  const r = canvas.width/2;
  arc = (Math.PI*2) / participants.length;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const fontSize = participants.length > 26 ? 12 : participants.length > 16 ? 15 : 19;

  for(let i=0;i<participants.length;i++){
    const angle = startAngle + i*arc;
    const color = wheelColors[i % wheelColors.length];
    ctx.beginPath();
    ctx.moveTo(r,r);
    ctx.arc(r,r,r-6, angle, angle+arc, false);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(27,21,18,.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(angle + arc/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = (color === '#FFFDF6') ? '#7A0E17' : (color === '#D4A017' ? '#1B1512' : '#FFFDF6');
    ctx.font = `700 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
    const label = participants[i].length > 16 ? participants[i].slice(0,15)+'…' : participants[i];
    ctx.fillText(label, r - 22, 5);
    ctx.restore();
  }
}

document.getElementById('spinBtn').addEventListener('click', spin);

function spin(){
  if(participants.length === 0) return;
  document.getElementById('spinBtn').disabled = true;

  spinAngleStart = Math.random() * 10 + 22;
  spinTime = 0;
  spinTimeTotal = Math.random() * 3000 + 5200;
  rotateWheel();
}

function rotateWheel(){
  spinTime += 30;
  if(spinTime >= spinTimeTotal){
    stopRotateWheel();
    return;
  }
  const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
  startAngle += (spinAngle * Math.PI / 180);
  drawWheel();
  spinTimeout = requestAnimationFrame(rotateWheel);
}

function stopRotateWheel(){
  cancelAnimationFrame(spinTimeout);
  const degrees = startAngle * 180 / Math.PI + 90;
  const arcd = arc * 180 / Math.PI;
  const index = Math.floor((360 - degrees % 360) / arcd) % participants.length;

  document.getElementById('winnerName').textContent = participants[index];
  document.getElementById('overlay').classList.add('show');
  document.getElementById('spinBtn').disabled = false;
  launchConfetti();
}

document.getElementById('closeModal').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});

function easeOut(t,b,c,d){
  const ts=(t/=d)*t;
  const tc=ts*t;
  return b+c*(tc + -3*ts + 3*t);
}

function launchConfetti(){
  const colors = ['#C81E2C','#D4A017','#FFFDF6'];
  for(let i=0;i<70;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const duration = 2500 + Math.random()*1600;
    const drift = (Math.random()-0.5)*220;
    c.animate([
      { transform:`translate(0,0) rotate(0deg)`, opacity:1 },
      { transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:.9 }
    ], { duration, easing:'ease-in' });
    setTimeout(()=>c.remove(), duration+100);
  }
}
</script>
</body>
</html>
