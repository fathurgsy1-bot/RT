<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinner Doorprise HUT RI 81</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 20px;
            background-image: linear-gradient(to bottom, #ffcccc, #ffffff);
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #d32f2f;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-size: 36px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        h2 {
            color: #555;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .spinner-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(211, 47, 47, 0.4);
            border: 8px solid #d32f2f;
            background-color: #fff;
        }
        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 50px solid #222;
            z-index: 10;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 40px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }
        #winner {
            font-size: 36px;
            font-weight: bold;
            color: #d32f2f;
            margin-top: 30px;
            min-height: 50px;
            animation: popIn 0.5s ease;
        }
        #loading {
            font-size: 18px;
            color: #555;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Doorprise HUT RI Ke-81</h1>
    <h2>Maju Terus, Nusantara Baru!</h2>

    <div id="loading">⏳ Memuat data dari Google Spreadsheet...<br><small>(Pastikan akses file disetel ke "Siapa saja yang memiliki link")</small></div>

    <div class="spinner-container" style="display: none;" id="spinnerContainer">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <br>
    <button id="spinBtn" style="display: none;">PUTAR SPINNER</button>
    <div id="winner"></div>

    <script>
        // ID dari URL Google Sheet Anda
        const sheetId = '1sISk8huyAbvHsgf6nYXUkk6H4u0aevR1J2V__1GGhQY';
        // Nama sheet (tab) yang ingin diambil
        const sheetName = encodeURIComponent('data upload');
        // URL format CSV dari Google Sheets
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;

        let participants = [];
        const colors = ['#d32f2f', '#ffffff']; 

        // Mengambil data menggunakan PapaParse
        Papa.parse(csvUrl, {
            download: true,
            header: true, // Diubah menjadi true agar membaca baris pertama sebagai Header Kolom
            complete: function(results) {
                const data = results.data;
                
                if (data.length > 0) {
                    // Mencari nama kolom yang mengandung kata "nama" (case insensitive)
                    const columnNames = Object.keys(data[0]);
                    const targetColumn = columnNames.find(col => col.toLowerCase().includes('nama'));

                    if (targetColumn) {
                        // Mengambil nilai khusus dari kolom "nama" dan membuang baris yang kosong
                        participants = data
                            .map(row => row[targetColumn])
                            .filter(name => name && name.trim() !== '');
                        
                        if (participants.length > 0) {
                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('spinnerContainer').style.display = 'block';
                            document.getElementById('spinBtn').style.display = 'inline-block';
                            drawWheel();
                        } else {
                            document.getElementById('loading').innerHTML = '❌ Data pada kolom "Nama" kosong.';
                        }
                    } else {
                        document.getElementById('loading').innerHTML = `❌ Tidak ditemukan kolom dengan judul "Nama". Kolom yang tersedia: ${columnNames.join(', ')}`;
                    }
                } else {
                    document.getElementById('loading').innerHTML = '❌ Data kosong atau Spreadsheet belum disetel ke "Siapa saja yang memiliki link".';
                }
            },
            error: function(err) {
                document.getElementById('loading').innerHTML = '❌ Gagal memuat data. Pastikan spreadsheet diatur ke "Anyone with the link can view".';
            }
        });

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        let startAngle = 0;
        let arc = 0;
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        function drawWheel() {
            if (participants.length === 0) return;
            
            arc = Math.PI / (participants.length / 2);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < participants.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % 2];
                
                ctx.beginPath();
                ctx.arc(250, 250, 250, angle, angle + arc, false);
                ctx.lineTo(250, 250);
                ctx.fill();
                
                ctx.save();
                ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#d32f2f'; 
                ctx.translate(250 + Math.cos(angle + arc / 2) * 200, 250 + Math.sin(angle + arc / 2) * 200);
                ctx.rotate(angle + arc / 2);
                const text = participants[i];
                
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(text, 30, 6);
                ctx.restore();
            }
        }

        document.getElementById('spinBtn').addEventListener('click', spin);

        function spin() {
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('winner').innerText = '';
            
            spinAngleStart = Math.random() * 10 + 20; 
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 5000; 
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = requestAnimationFrame(rotateWheel);
        }

        function stopRotateWheel() {
            cancelAnimationFrame(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - degrees % 360) / arcd);
            
            ctx.save();
            ctx.font = 'bold 30px Arial';
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.restore();
            
            document.getElementById('winner').innerHTML = '🎉 Selamat kepada:<br><span style="font-size: 48px; color: #2e7d32;">' + participants[index] + '</span> 🎉';
            document.getElementById('spinBtn').disabled = false;
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }
    </script>
</body>
</html>
